# Runs the repo's tests (node --test) on every pull request and on main, so a
# change that breaks the paste parser, the resume reader, the form splitter or
# the scripts shows up red before it is merged. Nothing to install.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
