/* ============================ resume reader ============================ */
/* Turns resume text (pasted, or read from a PDF or Word file) into the
   profile's fields. It only has to get close: the person checks every field
   before saving, and the whole text is kept as `resume` for Claude. */
var RESUME_HEADINGS = {
  summary: /^((professional |career )?summary|(professional )?profile|about( me)?|(career )?objective|overview|((summary|highlights) of )?qualifications|highlights)$/,
  skills: /^(((technical|core|key|professional|relevant) )?skills( (and|&) [a-z ]+)?|(core )?competencies|areas of expertise|expertise|technologies|tools and technologies|technical proficiencies)$/,
  experience: /^(((professional|work|relevant|employment|career) )?(experience|history)|employment)$/,
  other: /^(education( (and|&) training)?|training|certifications?|certificates|licen[cs]es( (and|&) certifications)?|certifications? (and|&) training|projects|(volunteer|community)( experience| work)?|volunteering|awards|honou?rs|achievements|references|interests|hobbies|languages|publications|courses|activities|affiliations|memberships)$/
};
// Bullet marks, including the private-use glyphs Word's symbol font leaves in PDFs.
var BULLET_MARK = "•·▪●◦‣∙○■□➢►✓✔*";
var BULLET = new RegExp("^([" + BULLET_MARK + "]|[-–—](?=\\s|$))\\s*");
var BULLET_ONLY = new RegExp("^[" + BULLET_MARK + "]$");
var RESUME_SEP = /\s+[|•·▪●◆]\s+/;

function resumeHeading(line){
  var l = line;
  if(/^([A-Za-z] ){3,}[A-Za-z]$/.test(l)) l = l.replace(/ /g, "");   // "S K I L L S"
  if(l.length > 40 || /[.!?,;]$/.test(l)) return null;
  l = l.toLowerCase().replace(/:$/, "").replace(/[^a-z& ]+/g, " ").replace(/\s+/g, " ").trim();
  for(var k in RESUME_HEADINGS){ if(RESUME_HEADINGS[k].test(l)) return k; }
  return null;
}
/* An email, phone number, link, or a bare "City, BC" line. */
function contactish(l){
  return /\S+@\S+\.\S+/.test(l) || /\b\d{3}[ .-]\d{4}\b/.test(l)
    || /(https?:\/\/|www\.|linkedin\.com|github\.com)/i.test(l)
    || /^[A-Z][A-Za-z .'-]+,\s*[A-Z]{2}( [A-Z]\d[A-Z] ?\d[A-Z]\d)?$/.test(l);
}
function nameLike(l){
  var words = l.split(" ").length;
  return words >= 2 && words <= 5 && l.length <= 50
    && /^[A-Za-zÀ-ÖØ-öø-ÿ][A-Za-zÀ-ÖØ-öø-ÿ'’.,\- ]+$/.test(l) && !resumeHeading(l);
}
/* "JORDAN O'NEIL-EXAMPLE" -> "Jordan O'Neil-Example"; mixed case is kept. */
function nameCase(l){
  if(l !== l.toUpperCase()) return l;
  return l.toLowerCase().replace(/(^|[\s'’\-])([a-zà-öø-ÿ])/g, function(m, a, b){ return a + b.toUpperCase(); });
}
function skillText(lines){
  return lines.map(function(l){
    return l.replace(BULLET, "").replace(new RegExp(RESUME_SEP.source, "g"), ", ").trim();
  }).filter(Boolean).join("\n");
}
/* Bullets become "- ", a line wrapped onto the next joins it again, and a
   blank line goes before each role (a plain line that follows bullets). */
function experienceText(lines){
  var items = [], nextIsBullet = false;
  lines.forEach(function(l){
    if(BULLET_ONLY.test(l)){ nextIsBullet = true; return; }   // a mark on a line of its own
    var isBullet = nextIsBullet || BULLET.test(l), text = l.replace(BULLET, "");
    var prev = items[items.length-1];
    nextIsBullet = false;
    if(!isBullet && prev && /^[a-z(]/.test(text) && !/[.!?:]$/.test(prev.text)){ prev.text += " " + text; return; }
    items.push({text:text, bullet:isBullet});
  });
  // Some PDFs draw bullets as shapes, leaving no marks in the text. Then a
  // line that ends like a sentence is read as a bullet, the rest as roles.
  if(!items.some(function(it){ return it.bullet; })){
    items.forEach(function(it){ it.bullet = /[.!?]$/.test(it.text); });
  }
  var out = [];
  items.forEach(function(it, i){
    if(!it.bullet && i && items[i-1].bullet) out.push("");
    out.push(it.bullet ? "- " + it.text : it.text);
  });
  return out.join("\n");
}
function parseResume(text){
  var lines = String(text || "").replace(/\r/g, "").split("\n").map(function(l){
    return l.replace(/\s+/g, " ").trim();
  }).filter(function(l){ return l && !/^page \d+( of \d+)?$/i.test(l); });

  var sec = {top:[], summary:[], skills:[], experience:[], other:[]}, cur = "top";
  lines.forEach(function(l){
    var h = resumeHeading(l);
    if(h) cur = h; else sec[cur].push(l);
  });

  var out = {name:"", headline:"", skills:skillText(sec.skills), experience:experienceText(sec.experience)};
  // The name: one of the first lines, before any contact details on it.
  var top = sec.top, at = -1;
  for(var i=0; i<top.length && i<6; i++){
    if(/^(curriculum vitae|r[eé]sum[eé]|cv)$/i.test(top[i])) continue;
    var first = top[i].split(RESUME_SEP)[0];
    if(!contactish(first) && nameLike(first)){ out.name = nameCase(first); at = i; break; }
  }
  // The headline: a short line just under the name, without contact details.
  for(var k=at+1; k<top.length && k<=at+3; k++){
    var parts = top[k].split(RESUME_SEP), keep = [];
    for(var p=0; p<parts.length && !contactish(parts[p]); p++) keep.push(parts[p]);
    var line = keep.join(" | ");
    if(line.length >= 3 && line.length <= 120){ out.headline = line; break; }
  }
  // Or the summary's first sentence, if it is short enough to read as one.
  if(!out.headline && sec.summary.length){
    var s = sec.summary.join(" ").replace(BULLET, "").match(/^.*?[.!?](\s|$)/);
    s = (s ? s[0] : sec.summary[0]).trim();
    if(s.length <= 160) out.headline = s;
  }
  return out;
}
/* One page of pdf.js text items as lines: a new line wherever the baseline
   moves or pdf.js marks an end of line, and a space where items have a gap. */
function pdfPageText(items){
  var lines = [], line = "", lastY = null, lastEnd = null;
  items.forEach(function(it){
    if(typeof it.str !== "string") return;
    var x = it.transform[4], y = it.transform[5];
    if(lastY !== null && Math.abs(y - lastY) > 2){ lines.push(line); line = ""; lastEnd = null; }
    else if(lastEnd !== null && x - lastEnd > 1 && line && !/\s$/.test(line) && !/^\s/.test(it.str)) line += " ";
    line += it.str;
    lastY = y; lastEnd = x + (it.width || 0);
    if(it.hasEOL){ lines.push(line); line = ""; lastY = null; lastEnd = null; }
  });
  if(line) lines.push(line);
  return lines.map(function(l){ return l.replace(/\s+/g, " ").trim(); }).join("\n")
    .replace(/\n{3,}/g, "\n\n").trim();
}

/* ============================ get started ============================ */
/* Optional, and skippable at every step: bring in a resume, check what was
   read from it, save the profile. Opened from the header button, and once by
   itself when the store says there is no profile yet, unless it was skipped
   in this browser before. */
var SKIP_KEY = "appdesk.v4.getstarted";
var RESUME_MAX = 60000;                // characters of resume text kept
var PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
var MAMMOTH = "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js";
var gs = null;                         // the open flow, or null
var gsOffered = false;

function renderProfileButton(){
  document.getElementById("btnStart").textContent = state.profile ? "Profile" : "Get started";
}
function offerOnboarding(){
  if(gsOffered || gs || state.profile || !store || store.kind === "local") return;
  gsOffered = true;
  var skipped = false;
  try{ skipped = localStorage.getItem(SKIP_KEY) === "skipped"; }catch(e){}
  if(skipped || !document.getElementById("addScrim").hidden) return;
  openGetStarted();
}
function openGetStarted(){
  var p = state.profile || {};
  gs = {step: state.profile ? "profile" : "resume", text:"", parsedFrom:null, note:"", noSections:false,
    f: {name:p.name||"", headline:p.headline||"", skills:p.skills||"", experience:p.experience||""}};
  document.getElementById("gsScrim").hidden = false;
  renderGetStarted();
}
function closeGetStarted(skipped){
  if(skipped && !state.profile){
    if(!DEMO){ try{ localStorage.setItem(SKIP_KEY, "skipped"); }catch(e){} }
    toast("Skipped. Get started is at the top whenever you want it.");
  }
  document.getElementById("gsScrim").hidden = true;
  gs = null;
}
function gsNote(msg){
  gs.note = msg;
  var el = document.getElementById("gsNote");
  if(el) el.textContent = msg;
}

function renderGetStarted(){
  var had = !!state.profile;
  var body = document.getElementById("gsBody"), foot = document.getElementById("gsFoot");
  var title = document.getElementById("gsTitle"), stepEl = document.getElementById("gsStep");
  body.classList.remove("drop");

  if(gs.step === "resume"){
    title.textContent = had ? "Replace from a resume" : "Get started";
    stepEl.textContent = had ? "" : "Step 1 of 2";
    body.innerHTML = '<p class="lead">' + (had
        ? "Read a newer resume. You can check every field before anything is saved."
        : "Add your resume so Claude can judge how well each job fits, draft letters, and answer application forms from it. Every step is optional.")
      + '</p><div class="pick"><button class="btn" id="gsPick">Choose a PDF or Word file</button>'
      + '<span class="hint" id="gsNote"></span></div>'
      + '<input type="file" id="gsFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>'
      + '<textarea class="field" id="gsText" placeholder="…or paste the text of your resume here"></textarea>'
      + '<p class="hint">The file is read here in your browser; only its text is kept.</p>';
    foot.innerHTML = '<button class="btn ghost" id="gsSkip">' + (had ? "Cancel" : "Skip for now") + '</button>'
      + (had ? '<button class="btn" id="gsBack">Back</button>' : '')
      + '<button class="btn primary" id="gsNext">Next</button>';
    var box = document.getElementById("gsText");
    box.value = gs.text;
    document.getElementById("gsNote").textContent = gs.note;
    box.addEventListener("input", function(){ gs.text = box.value; });
    document.getElementById("gsPick").addEventListener("click", function(){ document.getElementById("gsFile").click(); });
    document.getElementById("gsFile").addEventListener("change", function(e){
      if(e.target.files && e.target.files[0]) readResumeFile(e.target.files[0]);
      e.target.value = "";
    });
    if(had) document.getElementById("gsBack").addEventListener("click", function(){ gs.step = "profile"; renderGetStarted(); });
    document.getElementById("gsNext").addEventListener("click", function(){
      gs.text = box.value.trim();
      if(!gs.text) gs.parsedFrom = null;
      else if(gs.text !== gs.parsedFrom){
        var r = parseResume(gs.text);
        Object.keys(gs.f).forEach(function(k){ gs.f[k] = r[k] || gs.f[k]; });
        gs.parsedFrom = gs.text;
        gs.noSections = !r.skills && !r.experience;
      }
      gs.step = "profile"; renderGetStarted();
    });
    box.focus();
  }

  else if(gs.step === "profile"){
    title.textContent = had ? "Your profile" : "Check your profile";
    stepEl.textContent = had ? "" : "Step 2 of 2";
    body.innerHTML = '<p class="lead">' + (gs.parsedFrom
        ? "This is what was read from your resume. Fix anything that's off; it's all plain text."
        : "Plain text that Claude uses for fit scores, letters and application answers. Fill in what you like.")
      + (gs.parsedFrom && gs.noSections ? " No skills or experience headings were found, so fill those in if you like. Claude still reads the whole resume." : "")
      + '</p>'
      + '<label for="gsName">Name</label><input class="field" id="gsName" autocomplete="off">'
      + '<label for="gsHeadline">Headline</label><input class="field" id="gsHeadline" autocomplete="off" placeholder="The kind of work you do or want, in one line">'
      + '<label for="gsSkills">Skills</label><textarea class="field prose" id="gsSkills"></textarea>'
      + '<label for="gsExp">Experience</label><textarea class="field prose tall" id="gsExp"></textarea>';
    foot.innerHTML = (had && !gs.parsedFrom ? '<button class="btn ghost left" id="gsReplace">Replace from a resume</button>' : '')
      + (gs.parsedFrom || !had ? '<button class="btn" id="gsBack">Back</button>' : '')
      + '<button class="btn ghost" id="gsSkip">' + (had ? "Cancel" : "Skip for now") + '</button>'
      + '<button class="btn primary" id="gsSave">Save profile</button>';
    var map = {name:"gsName", headline:"gsHeadline", skills:"gsSkills", experience:"gsExp"};
    Object.keys(map).forEach(function(k){
      var el = document.getElementById(map[k]);
      el.value = gs.f[k];
      el.addEventListener("input", function(){ gs.f[k] = el.value; });
    });
    var rp = document.getElementById("gsReplace");
    if(rp) rp.addEventListener("click", function(){ gs.step = "resume"; renderGetStarted(); });
    var bk = document.getElementById("gsBack");
    if(bk) bk.addEventListener("click", function(){ gs.step = "resume"; renderGetStarted(); });
    document.getElementById("gsSave").addEventListener("click", saveGetStarted);
    document.getElementById("gsName").focus();
  }

  else {
    title.textContent = "Profile saved";
    stepEl.textContent = "";
    body.innerHTML = '<p class="lead">Claude can use it from now on. Some things to try:</p><ul>'
      + '<li>In chat, ask Claude to score the queued jobs in Seed Change against your profile.</li>'
      + '<li>When a company site has its own application form, open the job and use <b>Help me apply</b>.</li>'
      + '<li>Change your profile any time from <b>Profile</b> at the top.</li></ul>';
    foot.innerHTML = '<button class="btn primary" id="gsDone">Done</button>';
    document.getElementById("gsDone").addEventListener("click", function(){ closeGetStarted(false); });
    document.getElementById("gsDone").focus();
  }

  var skip = document.getElementById("gsSkip");
  if(skip) skip.addEventListener("click", function(){ closeGetStarted(true); });
}

function saveGetStarted(){
  var fields = {};
  Object.keys(gs.f).forEach(function(k){ fields[k] = gs.f[k].trim(); });
  if(gs.parsedFrom) fields.resume = gs.parsedFrom.slice(0, RESUME_MAX);
  var any = Object.keys(fields).some(function(k){ return fields[k]; });
  if(!any){ toast("Nothing to save yet. Fill in a field, or skip for now.", true); return; }
  var first = !state.profile;
  saveProfile(fields);
  renderProfileButton();
  if(gs.parsedFrom && gs.parsedFrom.length > RESUME_MAX) toast("Saved. Only the first 60,000 characters of the resume were kept.");
  if(first){ gs.step = "done"; renderGetStarted(); }
  else { closeGetStarted(false); toast("Profile saved"); }
}

/* Read a picked or dropped file into the resume box. The readers load from
   cdnjs the first time they are needed, so the page itself stays light. */
function readResumeFile(file){
  var name = file.name || "the file";
  var kind = (/\.pdf$/i.test(name) || file.type === "application/pdf") ? "pdf"
    : /\.docx$/i.test(name) ? "docx" : /\.doc$/i.test(name) ? "doc" : "";
  if(kind === "doc"){ gsNote("Older .doc files can't be read here. Save it as .docx or PDF, or paste the text."); return; }
  if(!kind){ gsNote("Pick a PDF or a Word (.docx) file, or paste the text."); return; }
  if(file.size > 10*1024*1024){ gsNote("That file is over 10 MB. Paste the text instead."); return; }
  gsNote("Reading " + name + "…");
  var flow = gs, r = new FileReader();
  r.onload = function(){
    (kind === "pdf" ? readPdf(r.result) : readDocx(r.result)).then(function(text){
      if(gs !== flow) return;                       // closed or reopened meanwhile
      text = text.trim();
      if(!text){
        gsNote(kind === "pdf" ? "This PDF has no text to read (it may be a scan). Paste the text instead." : "No text found in that file.");
        return;
      }
      gs.text = text;
      var box = document.getElementById("gsText");
      if(box) box.value = text;
      gsNote("Read " + name + ". Check the text, then Next.");
    }, function(e){
      if(gs !== flow) return;
      gsNote(e && e.code === "load" ? "The reader didn't load. Check your connection, or paste the text instead."
        : e && e.name === "PasswordException" ? "This PDF is password-protected. Paste the text instead."
        : "Couldn't read that file. Paste the text instead.");
    });
  };
  r.onerror = function(){ if(gs === flow) gsNote("Couldn't open that file. Paste the text instead."); };
  r.readAsArrayBuffer(file);
}

var loadedScripts = {};
function loadScripts(srcs){
  var key = srcs.join(" ");
  if(!loadedScripts[key]){
    loadedScripts[key] = srcs.reduce(function(prev, src){
      return prev.then(function(){
        return new Promise(function(res, rej){
          var s = document.createElement("script");
          s.src = src;
          s.onload = res;
          s.onerror = function(){
            s.parentNode.removeChild(s);
            var e = new Error("Could not load " + src); e.code = "load"; rej(e);
          };
          document.head.appendChild(s);
        });
      });
    }, Promise.resolve()).catch(function(e){ delete loadedScripts[key]; throw e; });
  }
  return loadedScripts[key];
}
/* pdf.js 3.11.174 is the last release with plain (non-module) scripts. Its
   worker script is loaded onto the page too, so pdf.js reads here instead of
   starting a Web Worker, which the artifact's sandbox may not allow.
   isEvalSupported:false closes CVE-2024-4367, which affects this version. */
function readPdf(buf){
  return loadScripts([PDFJS + "pdf.min.js", PDFJS + "pdf.worker.min.js"]).then(function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    return window.pdfjsLib.getDocument({data: new Uint8Array(buf), isEvalSupported: false}).promise;
  }).then(function(doc){
    var texts = [], n = 0, last = Math.min(doc.numPages, 20);
    function next(){
      if(++n > last){ doc.destroy(); return texts.join("\n\n"); }
      return doc.getPage(n).then(function(page){ return page.getTextContent(); })
        .then(function(tc){ texts.push(pdfPageText(tc.items)); return next(); });
    }
    return next();
  });
}
function readDocx(buf){
  return loadScripts([MAMMOTH]).then(function(){
    return window.mammoth.convertToHtml({arrayBuffer: buf});
  }).then(function(result){ return docxText(result.value); });
}
/* Word paragraphs and list items as lines, list items marked "• " so the
   resume reader sees the bullets (mammoth's plain-text output drops them). */
function docxText(html){
  var doc = new DOMParser().parseFromString(html, "text/html"), out = [];
  Array.prototype.forEach.call(doc.querySelectorAll("br"), function(br){
    br.parentNode.replaceChild(doc.createTextNode("\n"), br);
  });
  function push(text, mark){
    text.split("\n").forEach(function(t, i){
      t = t.replace(/\s+/g, " ").trim();
      if(t) out.push((mark && !i ? mark : "") + t);
    });
  }
  function walk(node){
    Array.prototype.forEach.call(node.children, function(el){
      if(el.tagName === "LI"){
        var own = "";
        Array.prototype.forEach.call(el.childNodes, function(c){
          if(!/^(UL|OL)$/.test(c.nodeName)) own += c.textContent;
        });
        push(own, "• ");
        Array.prototype.forEach.call(el.children, function(c){ if(/^(UL|OL)$/.test(c.tagName)) walk(c); });
      }
      else if(/^(P|H[1-6])$/.test(el.tagName)) push(el.textContent);
      else walk(el);
    });
  }
  walk(doc.body);
  return out.join("\n");
}

/* ============================ form questions ============================ */
/* Splits questions pasted from a company's own application form into one
   per line, leaving out what a copied form brings along: list numbers,
   required marks, buttons, file pickers, yes/no choices and placeholders.
   A line that only states a length limit joins the question above it. */
var FORM_NOISE = /^(required|optional|select( an? (option|one))?|please select|choose( one| an option)?|yes|no|n\/a|answer|your answer|type here|enter text|upload( (a |your )?(file|resume|cv|cover letter))?|attach( a file)?|choose file|browse|no file chosen|drop files? here.*|or drag and drop.*|submit( application)?|next|back|previous|save|continue|save (and|&) continue|cancel|step \d+( of \d+)?\b.*)$/i;

function cleanFormLine(l){
  return l.replace(/\s+/g, " ").trim()
    .replace(/^(\*\s*)+/, "")                                         // a leading required mark
    .replace(/^([•·▪●\-–—]|\(?(q(uestion)?\s*)?\d{1,2}[.):]|\(?[a-h][.)])(?=\s)\s*/i, "")   // bullets, numbers
    .replace(/\s*(\*|\(required\)|- required)$/i, "")                // a trailing required mark
    .trim();
}
/* "0/1000", "Maximum 250 words", "500 characters remaining" -> "max 1000
   characters" and so on; "" for any other line. */
function formLimit(l){
  var t = l.replace(/^\(/, "").replace(/\)\.?$/, "").trim();
  var m = t.match(/^\d[\d,]*\s*\/\s*(\d[\d,]*)(\s*(characters?|chars|words))?$/i)
    || t.match(/^(?:max(?:imum)?|limit(?:ed to)?|up to|no more than|(?:characters?|chars|words) (?:remaining|left|allowed))\s*:?\s*(\d[\d,]*)(\s*(characters?|chars|words))?$/i)
    || t.match(/^(\d[\d,]*)\s*(characters?|chars|words)(\s+(max(imum)?|limit|remaining|left|allowed|or (less|fewer)))?$/i);
  return m ? "max " + m[1] + (/word/i.test(t) ? " words" : " characters") : "";
}
/* The new questions in a paste, skipping any already in `existing`. */
function parseFormQuestions(raw, existing){
  var seen = {}, out = [], attach = false;   // attach: the last question was kept
  function key(t){   // the same question, whatever its case, marks or added limit
    return t.toLowerCase().replace(/\s*\(max [\d,]+ (characters|words)\)$/, "").replace(/[^a-z0-9]+/g, "");
  }
  (existing || []).forEach(function(t){ seen[key(t)] = 1; });
  String(raw || "").replace(/\r/g, "").split("\n").forEach(function(line){
    var l = cleanFormLine(line), limit = formLimit(l), last = out.length - 1;
    if(limit){
      if(attach && out[last].toLowerCase().indexOf(limit) < 0) out[last] += " (" + limit + ")";
      return;
    }
    if(!/[A-Za-z]/.test(l) || FORM_NOISE.test(l.replace(/[.:…]+$/, ""))) return;
    attach = !seen[key(l)];
    if(!attach) return;
    seen[key(l)] = 1;
    out.push(l);
  });
  return out;
}

/* ============================ events ============================ */
document.getElementById("headrow").addEventListener("click", function(e){
  var th = e.target.closest("th"); if(!th) return;
  var k = th.dataset.k;
  if(!k || k === "flags") return;
  if(ui.sort === k) ui.dir = -ui.dir; else { ui.sort = k; ui.dir = (k==="fit") ? -1 : 1; }
  renderHead(); renderRows();
});
document.getElementById("rows").addEventListener("click", function(e){
  if(e.target.closest("a")) return;
  var tr = e.target.closest("tr"); if(!tr) return;
  ui.sel = tr.dataset.id; ui.tab = "brief"; ui.editPosting = false;
  renderRows(); renderDrawer();
});
document.getElementById("chips").addEventListener("click", function(e){
  var c = e.target.closest(".chip"); if(!c) return;
  ui.filter = c.dataset.f; renderChips(); renderRows();
});
document.getElementById("search").addEventListener("input", function(e){
  ui.q = e.target.value; renderRows();
});
document.getElementById("tabs").addEventListener("click", function(e){
  var t = e.target.closest(".tab"); if(!t) return;
  ui.tab = t.dataset.t; ui.editPosting = false; renderDrawer(); renderRows();
});
document.getElementById("dClose").addEventListener("click", function(){
  ui.sel = null; renderRows(); renderDrawer();
});
document.getElementById("dStatus").addEventListener("change", function(e){
  var j = job(); if(!j) return;
  j.status = e.target.value;
  if((j.status==="applied") && !j.applied) j.applied = today();
  touch(j, ["status","applied"]); renderAll();
});
document.getElementById("dApplied").addEventListener("click", function(){
  var j = job(); if(!j) return;
  j.status = "applied"; j.applied = today();
  touch(j, ["status","applied"]); renderAll(); toast("Marked applied " + j.applied);
});
document.getElementById("dDelete").addEventListener("click", function(){
  var j = job(); if(!j) return;
  state.jobs = state.jobs.filter(function(x){ return x.id !== j.id; });
  removeJob(j.id);
  ui.sel = null; renderAll(); toast("Removed " + j.company);
});
document.getElementById("btnSave").addEventListener("click", saveState);
document.getElementById("btnLoad").addEventListener("click", function(){
  document.getElementById("fileIn").click();
});
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("btnAdd").addEventListener("click", function(){
  document.getElementById("pasteBox").value = "";
  document.getElementById("parsePreview").hidden = true;
  document.getElementById("addHint").textContent = "";
  document.getElementById("addScrim").hidden = false;
  document.getElementById("pasteBox").focus();
});
document.getElementById("addCancel").addEventListener("click", function(){
  document.getElementById("addScrim").hidden = true;
});
document.getElementById("pasteBox").addEventListener("input", showPreview);
document.getElementById("addConfirm").addEventListener("click", function(){
  var raw = document.getElementById("pasteBox").value;
  if(!raw.trim()) return;
  var p = parsePaste(raw);
  var ref = jobRef(p.url);
  // The same job: same link, same LinkedIn or Indeed job, or the same company
  // and title (the same posting found on another site).
  var same = function(a, b){ return String(a||"").toLowerCase().replace(/[^a-z0-9]/g,"") === String(b||"").toLowerCase().replace(/[^a-z0-9]/g,""); };
  var dup = state.jobs.filter(function(x){
    if(p.url && x.url === p.url) return true;
    var xr = jobRef(x.url);
    if(ref && xr && xr.site === ref.site && xr.id === ref.id) return true;
    return !!(p.company && p.title && same(x.company, p.company) && same(x.title, p.title));
  })[0];
  if(dup){
    document.getElementById("addScrim").hidden = true;
    ui.filter = "all"; ui.sel = dup.id; ui.tab = "brief";
    renderAll();
    toast("Already saved: " + dup.company + " (" + dup.status + ")");
    return;
  }
  var linkOnly = /^https?:\/\/\S+$/.test(raw.trim());
  var j = {
    id: uid(p.company || (ref ? ref.site.toLowerCase() + "-" + ref.id : "job")),
    company: p.company || (ref ? ref.site + " " + ref.id : "Unknown company"),
    title: p.title || (linkOnly ? "Details to fetch" : "Untitled role"),
    created: new Date().toISOString(),
    band: p.band, location: p.location, url: p.url, source: p.source,
    posted: p.posted || today(), applied: null, status: "queued",
    fit: null, notes: "", posting: linkOnly ? "" : (p.posting || raw.trim()), letter: "", questions: [], qSeen: null
  };
  state.jobs.unshift(j);
  create(j);
  document.getElementById("addScrim").hidden = true;
  ui.filter = "all"; ui.sel = j.id; ui.tab = "brief";
  renderAll(); renderDrawer();
  toast("Added " + j.company);
});
document.getElementById("btnStart").addEventListener("click", openGetStarted);
var gsBody = document.getElementById("gsBody");
gsBody.addEventListener("dragover", function(e){
  if(!gs || gs.step !== "resume") return;
  e.preventDefault(); gsBody.classList.add("drop");
});
gsBody.addEventListener("dragleave", function(){ gsBody.classList.remove("drop"); });
gsBody.addEventListener("drop", function(e){
  gsBody.classList.remove("drop");
  if(!gs || gs.step !== "resume") return;
  e.preventDefault();
  if(e.dataTransfer.files && e.dataTransfer.files[0]) readResumeFile(e.dataTransfer.files[0]);
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    if(gs){ closeGetStarted(true); return; }
    if(!document.getElementById("addScrim").hidden){ document.getElementById("addScrim").hidden = true; return; }
    if(ui.sel){ ui.sel = null; renderRows(); renderDrawer(); }
  }
});

/* ============================ boot ============================ */
function refresh(){
  renderStats(); renderChips(); renderRows();
  var a = document.activeElement;
  var editing = a && a.closest && a.closest("#dBody") && /^(TEXTAREA|INPUT)$/.test(a.tagName);
  renderDrawer(editing);
}
function renderAll(){ renderStats(); renderChips(); renderHead(); renderRows(); renderDrawer(); renderProfileButton(); }
renderAll();
connect();
})();
</script>
