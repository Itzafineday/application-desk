<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seed Change</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f4f6f8; --surface-3:#e4e8ec;
  --text:#151a20; --muted:#5b6673; --faint:#8a95a2;
  --line:#d0d7de; --line-soft:#e2e7ec;
  --accent:#9a6a15; --accent-soft:#f2e6cd; --accent-line:#c9a35a;
  --s-queued:#6b7787; --s-working:#a86f10; --s-applied:#37628f;
  --s-interview:#256b4c; --s-offer:#1d7a46; --s-closed:#8d97a2;
  --good:#256b4c; --warn:#a86f10; --bad:#a33a32;
  --shadow:0 1px 2px rgba(20,28,36,.06),0 8px 24px rgba(20,28,36,.08);
  --radius:5px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1317; --surface:#171d23; --surface-2:#1d242c; --surface-3:#252e37;
    --text:#e4e9ee; --muted:#96a3b1; --faint:#6c7885;
    --line:#2b343e; --line-soft:#222a32;
    --accent:#dfa945; --accent-soft:#31281a; --accent-line:#6b5423;
    --s-queued:#8492a2; --s-working:#d09a2e; --s-applied:#6a9fd4;
    --s-interview:#52b587; --s-offer:#4fc08a; --s-closed:#77828e;
    --good:#52b587; --warn:#d09a2e; --bad:#e2726a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#171d23; --surface-2:#1d242c; --surface-3:#252e37;
  --text:#e4e9ee; --muted:#96a3b1; --faint:#6c7885;
  --line:#2b343e; --line-soft:#222a32;
  --accent:#dfa945; --accent-soft:#31281a; --accent-line:#6b5423;
  --s-queued:#8492a2; --s-working:#d09a2e; --s-applied:#6a9fd4;
  --s-interview:#52b587; --s-offer:#4fc08a; --s-closed:#77828e;
  --good:#52b587; --warn:#d09a2e; --bad:#e2726a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px; line-height:1.5; height:100%; overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;height:100%}

/* ---------- header ---------- */
header{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{
  font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em;
}
.sync{font-size:11.5px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync[data-s="live"]{color:var(--muted)} .sync[data-s="live"]::before{background:var(--good)}
.sync[data-s="local"]{color:var(--warn)} .sync[data-s="local"]::before{background:var(--warn)}
.sync[data-s="demo"]{color:var(--accent)} .sync[data-s="demo"]::before{background:var(--accent)}
.brand .ver{
  font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:10px;
  color:var(--faint);letter-spacing:.08em;text-transform:uppercase;
}
.stats{display:flex;gap:0;margin-left:auto;flex-wrap:wrap}
.stat{
  padding:0 14px;border-left:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:1px;min-width:62px;
}
.stat:first-child{border-left:0}
.stat b{
  font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:600;
  line-height:1.1;font-variant-numeric:tabular-nums;
}
.stat span{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
}
.stat.hl b{color:var(--accent)}
.hactions{display:flex;gap:6px}

/* ---------- buttons ---------- */
.btn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--text);
  transition:background .12s,border-color .12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3);border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#14100a}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:4px 8px;font-size:11.5px}

/* ---------- toolbar ---------- */
.toolbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:transparent;border-radius:99px;
  padding:3px 11px;font-size:11.5px;font-weight:500;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
.chip:hover{border-color:var(--accent-line);color:var(--text)}
.chip[aria-pressed="true"]{
  background:var(--accent-soft);border-color:var(--accent-line);color:var(--text);
}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.search{
  margin-left:auto;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:5px 10px;width:230px;font-size:12.5px;
}
.search:focus{border-color:var(--accent-line);outline:none}

/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0}
.tablewrap{flex:1;overflow:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
thead th{
  position:sticky;top:0;z-index:2;background:var(--surface-2);
  border-bottom:1px solid var(--line);text-align:left;
  padding:7px 10px;font-size:10px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);white-space:nowrap;user-select:none;cursor:pointer;
}
thead th:hover{color:var(--text)}
thead th .arrow{color:var(--accent);font-size:9px;margin-left:3px}
tbody tr{border-bottom:1px solid var(--line-soft);cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody td{padding:8px 10px;vertical-align:middle}
td.co{font-weight:600;white-space:nowrap}
td.role{color:var(--muted);max-width:270px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num,td.band{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
td.band{color:var(--muted)}
td.loc{color:var(--muted);font-size:12px;white-space:nowrap}
tr.closed td.co,tr.closed td.role{color:var(--faint);font-weight:400}

.pill{
  display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;
  font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  border:1px solid currentColor;
}
.pill.queued{color:var(--s-queued)} .pill.working{color:var(--s-working)}
.pill.applied{color:var(--s-applied)} .pill.interview{color:var(--s-interview)}
.pill.offer{color:var(--s-offer)} .pill.closed{color:var(--s-closed)}

.fit{display:flex;align-items:center;gap:7px}
.fit .bar{width:36px;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.fit .bar i{display:block;height:100%;background:var(--accent)}
.fit.hi .bar i{background:var(--good)}
.fit.lo .bar i{background:var(--s-closed)}

.flags{display:flex;gap:5px;align-items:center}
.flag{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;
  padding:1px 5px;border-radius:3px;background:var(--surface-3);color:var(--muted);
}
.flag.on{background:var(--accent-soft);color:var(--accent)}
.flag.q{background:transparent;border:1px solid var(--line);}
.flag.q.open{border-color:var(--warn);color:var(--warn)}
.flag.q.answered{border-color:var(--good);color:var(--good)}
a.flag.link{background:transparent;border:1px solid var(--accent-line);color:var(--accent);text-decoration:none}
a.flag.link:hover{background:var(--accent-soft)}
.flag.notext{background:transparent;border:1px dashed var(--bad);color:var(--bad)}
a.btn{text-decoration:none;display:inline-block}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

.empty{padding:56px 24px;text-align:center;color:var(--faint)}

/* ---------- drawer ---------- */
.drawer{
  width:min(520px,46vw);border-left:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;min-height:0;
}
.drawer[hidden]{display:none}
.dhead{padding:14px 16px 10px;border-bottom:1px solid var(--line-soft)}
.dhead .top{display:flex;align-items:flex-start;gap:10px}
.dhead h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em;flex:1}
.dhead .sub{color:var(--muted);font-size:13px;margin:2px 0 9px}
.dmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.dmeta a{color:var(--accent)}
.dctl{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
select.status{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 8px;font-size:12px;
}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line-soft)}
.tab{
  background:none;border:0;padding:8px 11px;font-size:12.5px;font-weight:500;
  color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:middle}
.dbody{flex:1;overflow:auto;padding:14px 16px 22px}
.dbody h3{
  font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
  margin:0 0 7px;font-weight:600;
}
.notes,.posting{white-space:pre-wrap;font-size:13px;line-height:1.62}
.posting{font-size:12.5px;color:var(--muted);max-height:none}
textarea.field{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;resize:vertical;line-height:1.6;
}
textarea.letter{
  font-family:"Newsreader",Georgia,serif;font-size:14.5px;line-height:1.72;min-height:420px;
}
textarea.note{min-height:110px;font-size:13px}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.hint{font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}

/* ---------- Q&A ---------- */
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{border-radius:var(--radius);padding:9px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap}
.msg.user{background:var(--surface-2);border:1px solid var(--line-soft)}
.msg.claude{background:var(--accent-soft);border:1px solid var(--accent-line)}
.msg .who{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--faint);display:block;margin-bottom:4px;
}
.msg.claude .who{color:var(--accent)}
.qempty{color:var(--faint);font-size:12.5px;margin-bottom:12px}

/* ---------- help me apply ---------- */
.fq{border:1px solid var(--line-soft);border-radius:var(--radius);padding:9px 12px;margin-bottom:10px}
.fq .q{font-size:13px;font-weight:500;line-height:1.55}
.fq .q .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin-right:7px}
.fq .a{
  white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:7px;padding:8px 11px;
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--radius);
}
.fq .a.none{background:transparent;border:1px dashed var(--line);color:var(--faint);font-size:12px;padding:5px 11px}
.fq .rowbtns{margin:7px 0 0;align-items:center}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(10,14,18,.55);display:flex;
  align-items:center;justify-content:center;padding:24px;z-index:50;
}
.scrim[hidden]{display:none}
.modal{
  background:var(--surface);border:1px solid var(--line);border-radius:7px;
  box-shadow:var(--shadow);width:min(760px,100%);max-height:86vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.modal header{border-bottom:1px solid var(--line-soft);background:transparent;padding:13px 16px}
.modal h2{margin:0;font-size:15px;font-weight:600}
.modal .body{padding:14px 16px;overflow:auto}
.modal .foot{
  padding:11px 16px;border-top:1px solid var(--line-soft);
  display:flex;gap:8px;justify-content:flex-end;align-items:center;
}
.modal textarea{min-height:210px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.preview{
  margin-top:12px;padding:11px 13px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:var(--radius);font-size:13px;
}
.preview dl{display:grid;grid-template-columns:78px 1fr;gap:5px 12px;margin:0}
.preview dt{
  font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
  padding-top:2px;font-weight:600;
}
.preview dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-word}

/* ---------- get started ---------- */
.gs header .hint{margin-left:auto}
.gs .lead{margin:0 0 12px;font-size:13px;color:var(--muted)}
.gs .pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.gs label{
  display:block;margin:14px 0 5px;font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.09em;color:var(--faint);
}
.gs label:first-of-type{margin-top:0}
.gs input.field{
  width:100%;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 10px;font-size:13px;
}
.gs textarea.prose{font-family:inherit;font-size:13px;min-height:96px}
.gs textarea.prose.tall{min-height:220px}
.gs .foot .left{margin-right:auto}
.gs ul{margin:0;padding-left:18px;line-height:1.75}
.gs .body.drop{outline:2px dashed var(--accent-line);outline-offset:-8px}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:var(--radius);
  font-size:12.5px;font-weight:500;box-shadow:var(--shadow);z-index:80;
}
.toast[hidden]{display:none}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:900px){
  .drawer{
    position:fixed;inset:0;width:100%;z-index:40;border-left:0;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .stats{width:100%;margin-left:0;order:3}
  .search{width:100%;margin-left:0}
}
</style>

</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>Seed Change</h1>
      <span class="ver">v4</span>
      <span class="sync" id="sync" data-s="connecting">Connecting…</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="hactions">
      <button class="btn ghost" id="btnStart">Get started</button>
      <button class="btn" id="btnAdd">Add postings</button>
      <button class="btn" id="btnSave">Export backup</button>
      <button class="btn ghost" id="btnLoad">Import</button>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="toolbar">
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="Search company, role, notes…">
  </div>

  <main>
    <div class="tablewrap">
      <table>
        <thead><tr id="headrow"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>Nothing matches that filter.</div>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="dhead">
        <div class="top">
          <h2 id="dCompany"></h2>
          <button class="btn ghost sm" id="dClose" aria-label="Close details">Close</button>
        </div>
        <p class="sub" id="dTitle"></p>
        <div class="dmeta" id="dMeta"></div>
        <div class="dctl">
          <select class="status" id="dStatus">
            <option value="queued">Queued</option>
            <option value="working">Working</option>
            <option value="applied">Applied</option>
            <option value="interview">Interview</option>
            <option value="offer">Offer</option>
            <option value="closed">Closed</option>
          </select>
          <a class="btn primary sm" id="dOpen" target="_blank" rel="noopener">Open posting ↗</a>
          <button class="btn sm" id="dApplied">Mark applied today</button>
          <button class="btn ghost sm" id="dDelete">Delete</button>
        </div>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="dbody" id="dBody"></div>
    </aside>
  </main>
</div>

<div class="scrim" id="addScrim" hidden>
  <div class="modal">
    <header><h2>Add postings</h2></header>
    <div class="body">
      <p class="hint" style="margin-top:0">Paste a whole LinkedIn or Indeed page (select all, copy), or just the job's link. Company, role, location, band and posted date are pulled out where they can be; Claude fills in the rest.</p>
      <textarea class="field" id="pasteBox" placeholder="Paste the posting here…"></textarea>
      <div class="preview" id="parsePreview" hidden></div>
    </div>
    <div class="foot">
      <span class="hint" id="addHint"></span>
      <button class="btn ghost" id="addCancel">Cancel</button>
      <button class="btn primary" id="addConfirm">Add to queue</button>
    </div>
  </div>
</div>

<div class="scrim" id="gsScrim" hidden>
  <div class="modal gs" role="dialog" aria-modal="true" aria-labelledby="gsTitle">
    <header><h2 id="gsTitle">Get started</h2><span class="hint" id="gsStep"></span></header>
    <div class="body" id="gsBody"></div>
    <div class="foot" id="gsFoot"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
"use strict";

/* ============================ state ============================ */
/* The jobs live in a store (see "stores" below). In claude.ai that is the
   artifact's shared database, which Claude reads and writes too. The page
   keeps a localStorage copy only so it can draw before the store answers.
   appdesk.v2 is the old browser copy: read once for migration, never written. */
var V2_KEY = "appdesk.v2";
var CACHE_KEY = "appdesk.v3.cache";
var MIGRATED_KEY = "appdesk.v3.migrated";   // gitleaks:allow (a storage key name, not a secret)
var STATUSES = ["queued","working","applied","interview","offer","closed"];
var STATUS_ORDER = {interview:0,offer:1,working:2,applied:3,queued:4,closed:5};
var FIELDS = ["company","title","band","location","url","source","posted","applied","status",
  "fit","notes","posting","letter","questions","qSeen","created","form"];
/* The profile is one document, filled in by Get started or by Claude. These
   fields are plain text; any others a document carries are kept as they are. */
var PROFILE_TEXT = ["name","headline","skills","experience","resume"];

/* Inside claude.ai the platform sets window.claude before this script runs.
   Anywhere else (a local server, another host) the page is a demo that loads
   fictional jobs from sample-data.json and saves nothing. */
var DEMO = !(window.claude && window.claude.use);

var store = null;          // the active store; null until connect() picks one
var pending = {};          // id -> fields changed here and not yet written
var profilePending = null; // profile fields changed here and not yet written
var flushTimer = null, cacheTimer = null;

var state = normalize({jobs: DEMO ? [] : (readLocal(CACHE_KEY) || readLocal(V2_KEY) || [])});
state.profile = DEMO ? null : readCachedProfile();   // null until there is one
var ui = {sort:"smart", dir:1, filter:"all", q:"", sel:null, tab:"brief"};

function readLocal(key){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return null;
    var p = JSON.parse(raw);
    return (p && Array.isArray(p.jobs) && p.jobs.length) ? p.jobs : null;
  }catch(e){ return null; }
}
function readCachedProfile(){
  try{
    var p = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    return p ? normProfile(p.profile) : null;
  }catch(e){ return null; }
}
/* A profile document, with its text fields as strings, or null for none. */
function normProfile(p){
  if(!p || typeof p !== "object" || Array.isArray(p)) return null;
  var o = JSON.parse(JSON.stringify(p));
  PROFILE_TEXT.forEach(function(f){ o[f] = typeof o[f] === "string" ? o[f] : ""; });
  return o;
}
/* Exports from before v4 carry {name, contact}; only text beyond a name
   makes a profile worth importing. */
function profileHasText(p){
  return !!p && ["headline","skills","experience","resume"].some(function(f){
    return typeof p[f] === "string" && p[f].trim();
  });
}
function normalize(s){
  s.version = 3;
  s.jobs = (s.jobs||[]).map(function(j){
    j.id = j.id || uid(j.company);
    j.company = j.company || "Unknown company";
    j.title = j.title || "Untitled role";
    j.status = STATUSES.indexOf(j.status) >= 0 ? j.status : "queued";
    j.questions = Array.isArray(j.questions) ? j.questions : [];
    j.form = Array.isArray(j.form) ? j.form : [];
    j.fit = (j.fit === 0 || j.fit) ? j.fit : null;
    j.letter = j.letter || "";
    j.notes = j.notes || "";
    j.posting = j.posting || "";
    j.applied = j.applied || null;
    j.qSeen = j.qSeen || null;
    return j;
  });
  return s;
}
function clean(j){
  var o = {id:j.id};
  FIELDS.forEach(function(f){ if(j[f] !== undefined) o[f] = j[f]; });
  return JSON.parse(JSON.stringify(o));
}
function byId(id){ return state.jobs.filter(function(j){ return j.id === id; })[0]; }

function cacheLocal(){
  if(DEMO) return;                      // sample jobs never enter the cache
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(function(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({version:3, jobs:state.jobs, profile:state.profile})); }catch(e){}
  }, 500);
}
function setSync(s){
  var el = document.getElementById("sync");
  el.dataset.s = s;
  el.textContent = s === "live" ? "Synced with Claude"
    : s === "local" ? "This browser only"
    : s === "demo" ? "Demo data, not saved" : "Connecting…";
  el.title = s === "local"
    ? "The shared store is not available in this view. Changes stay in this browser."
    : s === "demo"
    ? "Fictional jobs from sample-data.json. Changes last until the page reloads."
    : "";
}

/* Record a change to some fields of one job. Writes are batched per job. */
function touch(j, names){
  var f = pending[j.id] || (pending[j.id] = {});
  names.forEach(function(n){ f[n] = (j[n] === undefined ? null : j[n]); });
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 400);
  cacheLocal();
}
function flush(){
  if(!store) return;                    // stays pending until a store is ready
  var batch = pending; pending = {};
  Object.keys(batch).forEach(function(id){
    var j = byId(id);
    store.update(id, batch[id], j && clean(j)).catch(writeFailed);
  });
}
function create(j){
  cacheLocal();
  if(!store) return;
  store.put(clean(j)).catch(writeFailed);
}
function removeJob(id){
  delete pending[id];
  cacheLocal();
  if(!store) return;
  store.remove(id).catch(writeFailed);
}
/* Change some profile fields, creating the profile if there is none. */
function saveProfile(fields){
  var p = state.profile || {};
  fields.updated = new Date().toISOString();
  Object.keys(fields).forEach(function(k){ p[k] = fields[k]; });
  state.profile = normProfile(p);
  profilePending = profilePending || {};
  Object.keys(fields).forEach(function(k){ profilePending[k] = fields[k]; });
  cacheLocal();
  flushProfile();
}
function flushProfile(){
  if(!store || !profilePending) return; // stays pending until a store is ready
  var f = profilePending; profilePending = null;
  store.updateProfile(f, JSON.parse(JSON.stringify(state.profile))).catch(writeFailed);
}
function writeFailed(e){
  var code = e && e.code;
  if(code === "quota_exceeded") toast("The job list is full. Delete some closed postings, then try again.", true);
  else if(code === "revoked"){ useStore(browserStore()); toast("Lost access to your saved jobs. Reload the page.", true); }
  else toast("A change did not save. Reload the page and check it.", true);
}

/* ============================ stores ============================ */
/* Every store has the same shape, so nothing outside this section knows
   where the jobs and the profile are kept:
     kind                     "live", "local" or "demo"; drives the sync badge
     start(onJobs, onLost, onProfile)
                              deliver the whole job list now and after every
                              change, as onJobs(jobs, fromCache), and the
                              profile the same way, as onProfile(profile or
                              null, fromCache); call onLost(err) if the
                              connection drops for good
     update(id, fields, job)  merge some fields into one job; `job` is the
                              whole job, for a store that must create it  -> Promise
     put(job)                 create or replace one job                   -> Promise
     remove(id)               delete one job                              -> Promise
     updateProfile(fields, profile)
                              merge some fields into the profile; `profile`
                              is the whole profile, for creating it       -> Promise
   A hosted backend later is one more function returning this shape. */

/* The artifact's shared database (the claude.ai "db" capability). The jobs
   are the `jobs` collection; the profile is the one document `profile/me`. */
function artifactStore(db){
  function ref(id){ return db.doc("jobs/" + id); }
  function put(j){ return retry(function(){ return ref(j.id).set(j); }); }
  function profileRef(){ return db.doc("profile/me"); }

  /* Copy jobs from the old v2 browser record into the shared database, once. */
  function migrate(){
    var done = false;
    try{ done = localStorage.getItem(MIGRATED_KEY) === "1"; }catch(e){}
    var old = readLocal(V2_KEY);
    if(done || !old) return Promise.resolve();
    return db.collection("jobs").limit(1000).get().then(function(snap){
      var have = {};
      snap.docs.forEach(function(d){ have[d.id] = 1; });
      var todo = normalize({jobs: JSON.parse(JSON.stringify(old))}).jobs
        .filter(function(j){ return !have[j.id]; });
      var i = 0;
      function next(){
        var chunk = todo.slice(i, i + 4); i += 4;
        if(!chunk.length) return Promise.resolve();
        return Promise.all(chunk.map(function(j){ return put(clean(j)); })).then(next);
      }
      return next().then(function(){
        try{ localStorage.setItem(MIGRATED_KEY, "1"); }catch(e){}
        if(todo.length) toast("Moved " + todo.length + " postings into your saved jobs");
      });
    });
  }

  return {
    kind: "live",
    start: function(onJobs, onLost, onProfile){
      profileRef().onSnapshot(function(snap){
        onProfile(snap.exists ? JSON.parse(JSON.stringify(snap.data() || {})) : null,
          snap.metadata.fromCache);
      }, onLost);
      migrate().then(null, function(){
        toast("Some postings did not move across yet. Reload to try again.", true);
      }).then(function(){
        db.collection("jobs").limit(1000).onSnapshot(function(snap){
          onJobs(snap.docs.map(function(d){
            var o = JSON.parse(JSON.stringify(d.data() || {}));
            o.id = d.id;
            return o;
          }), snap.metadata.fromCache);
        }, onLost);
      });
    },
    update: function(id, fields, job){
      return retry(function(){ return ref(id).update(fields); }).catch(function(e){
        if(e && e.code === "invalid_argument" && job) return put(job);
        throw e;
      });
    },
    put: put,
    remove: function(id){ return retry(function(){ return ref(id).delete(); }); },
    updateProfile: function(fields, profile){
      return retry(function(){ return profileRef().update(fields); }).catch(function(e){
        if(e && e.code === "invalid_argument" && profile){   // no profile yet
          return retry(function(){ return profileRef().set(profile); });
        }
        throw e;
      });
    }
  };
}

/* No shared store in this view: the page works from its localStorage cache,
   which cacheLocal() keeps current, so a write has nothing left to do. */
function browserStore(){
  function done(){ return Promise.resolve(); }
  return {kind:"local", start:function(){}, update:done, put:done, remove:done, updateProfile:done};
}

/* Fictional jobs and profile for trying the page outside claude.ai. Edits
   stay in the page's memory until it reloads. */
function demoStore(url){
  function done(){ return Promise.resolve(); }
  return {
    kind: "demo",
    start: function(onJobs, onLost, onProfile){
      fetch(url).then(function(r){
        if(!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }).then(function(data){
        onProfile((data && data.profile) || null, false);
        onJobs((data && data.jobs) || [], false);
      }, onLost);
    },
    update: done, put: done, remove: done, updateProfile: done
  };
}

function retry(fn){
  return fn().catch(function(e){
    var code = e && e.code;
    if(code !== "unavailable" && code !== "resource_exhausted") throw e;
    return new Promise(function(res){ setTimeout(res, 600 + Math.random()*900); }).then(fn);
  });
}

/* ============================ connect ============================ */
function connect(){
  if(DEMO){ useStore(demoStore("sample-data.json")); return; }
  window.claude.use("db").then(function(d){
    useStore(d ? artifactStore(d) : browserStore());
  }, function(){ useStore(browserStore()); });
}
function useStore(s){
  store = s;
  if(s.kind === "local") setSync("local");
  s.start(function(jobs, fromCache){
    if(store !== s) return;               // replaced since, e.g. connection lost
    if(!jobs.length && fromCache && state.jobs.length) return;
    jobs.forEach(function(o){
      var p = pending[o.id];
      if(p) Object.keys(p).forEach(function(k){ o[k] = p[k]; });
    });
    state.jobs = normalize({jobs: jobs}).jobs;
    setSync(s.kind);
    cacheLocal();
    refresh();
    if(Object.keys(pending).length) flush();
  }, function(){
    if(store !== s) return;
    if(s.kind === "demo"){
      setSync("demo");
      document.getElementById("empty").textContent =
        "The sample data did not load. Serve the public folder over HTTP (see the README) instead of opening the file directly.";
      refresh();
      return;
    }
    useStore(browserStore());
    toast("Lost connection to your saved jobs. Reload to reconnect.", true);
  }, function(p, fromCache){
    if(store !== s) return;
    p = normProfile(p);
    if(!p && fromCache && state.profile) return;
    if(profilePending){
      p = p || {};
      Object.keys(profilePending).forEach(function(k){ p[k] = profilePending[k]; });
      p = normProfile(p);
    }
    state.profile = p;
    cacheLocal();
    renderProfileButton();
    if(!fromCache) offerOnboarding();
    flushProfile();
  });
}
function uid(co){
  return String(co||"job").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,26)
    + "-" + Math.random().toString(36).slice(2,9);
}
function today(){
  var d = new Date(), p = function(n){return n<10?"0"+n:""+n};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ============================ toast ============================ */
var toastEl = document.getElementById("toast"), toastT = null;
function toast(msg, bad){
  toastEl.textContent = msg;
  toastEl.className = "toast" + (bad ? " bad" : "");
  toastEl.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.hidden = true; }, 2600);
}

/* ============================ derived ============================ */
function openQ(j){
  if(!j.questions.length) return false;
  return j.questions[j.questions.length-1].who === "user";
}
function newAnswer(j){
  if(!j.questions.length) return false;
  var last = j.questions[j.questions.length-1];
  return last.who === "claude" && j.qSeen !== last.id;
}
function unscored(j){ return j.status === "queued" && j.fit == null; }
function noText(j){ return j.status !== "closed" && !(j.posting && j.posting.trim()); }
function counts(){
  var c = {all:state.jobs.length};
  STATUSES.forEach(function(s){ c[s] = 0; });
  state.jobs.forEach(function(j){ c[j.status]++; });
  c.live = c.applied + c.interview + c.offer;
  c.q = state.jobs.filter(openQ).length;
  c.unscored = state.jobs.filter(unscored).length;
  c.notext = state.jobs.filter(noText).length;
  return c;
}
function visible(){
  var q = ui.q.toLowerCase().trim();
  var list = state.jobs.filter(function(j){
    if(ui.filter === "live"){ if(["applied","interview","offer"].indexOf(j.status)<0) return false; }
    else if(ui.filter === "unscored"){ if(!unscored(j)) return false; }
    else if(ui.filter === "notext"){ if(!noText(j)) return false; }
    else if(ui.filter !== "all" && j.status !== ui.filter) return false;
    if(!q) return true;
    return (j.company+" "+j.title+" "+(j.notes||"")+" "+(j.location||"")).toLowerCase().indexOf(q) >= 0;
  });
  var key = ui.sort, dir = ui.dir;
  list.sort(function(a,b){
    if(key === "smart"){
      var d = (STATUS_ORDER[a.status]-STATUS_ORDER[b.status]);
      if(d) return d;
      return (b.fit||0)-(a.fit||0);
    }
    var av = a[key], bv = b[key];
    if(key === "fit"){ av = av||0; bv = bv||0; return (av-bv)*dir; }
    if(key === "status"){ return (STATUS_ORDER[a.status]-STATUS_ORDER[b.status])*dir; }
    if(key === "band"){ av = bandNum(a.band); bv = bandNum(b.band); return (av-bv)*dir; }
    av = String(av||"").toLowerCase(); bv = String(bv||"").toLowerCase();
    return (av<bv?-1:av>bv?1:0)*dir;
  });
  return list;
}
function bandNum(b){
  if(!b) return 0;
  var m = String(b).replace(/,/g,"").match(/(\d+(?:\.\d+)?)\s*[kK]?/);
  if(!m) return 0;
  var n = parseFloat(m[1]);
  if(n < 1000) n = n*1000;
  return n;
}

/* ============================ render: stats + chips ============================ */
function renderStats(){
  var c = counts();
  var cells = [
    ["Live", c.live, true],
    ["Interview", c.interview, false],
    ["Queued", c.queued, false],
    ["To score", c.unscored, c.unscored>0],
    ["No text", c.notext, c.notext>0],
    ["Closed", c.closed, false],
    ["Open Qs", c.q, c.q>0]
  ];
  document.getElementById("stats").innerHTML = cells.map(function(x){
    return '<div class="stat'+(x[2]?" hl":"")+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>';
  }).join("");
}
function renderChips(){
  var c = counts();
  var defs = [["all","All",c.all],["live","Live",c.live],["unscored","To score",c.unscored],["notext","No text",c.notext],["queued","Queued",c.queued],
    ["working","Working",c.working],["applied","Applied",c.applied],
    ["interview","Interview",c.interview],["closed","Closed",c.closed]];
  document.getElementById("chips").innerHTML = defs.map(function(d){
    return '<button class="chip" data-f="'+d[0]+'" aria-pressed="'+(ui.filter===d[0])+'">'
      + d[1] + '<span class="n">' + d[2] + '</span></button>';
  }).join("");
}

/* ============================ render: table ============================ */
var COLS = [
  {k:"company", label:"Company"},
  {k:"title", label:"Role"},
  {k:"status", label:"Status"},
  {k:"fit", label:"Fit"},
  {k:"band", label:"Band"},
  {k:"location", label:"Location"},
  {k:"posted", label:"Posted"},
  {k:"flags", label:"", nosort:true}
];
function renderHead(){
  document.getElementById("headrow").innerHTML = COLS.map(function(c){
    var arrow = (ui.sort===c.k) ? '<span class="arrow">'+(ui.dir>0?"▲":"▼")+'</span>' : "";
    return '<th data-k="'+c.k+'"'+(c.nosort?' style="cursor:default"':"")+'>'+c.label+arrow+'</th>';
  }).join("");
}
function fitCell(f){
  if(f==null) return '<span style="color:var(--faint)">—</span>';
  var cls = f>=85 ? "hi" : (f<60 ? "lo" : "");
  return '<span class="fit '+cls+'"><span class="bar"><i style="width:'+f+'%"></i></span>'+f+'</span>';
}
function renderRows(){
  var list = visible();
  var html = list.map(function(j){
    var flags = "";
    if(j.url) flags += '<a class="flag link" href="'+esc(j.url)+'" target="_blank" rel="noopener" title="Open the posting">↗</a>';
    if(noText(j)) flags += '<span class="flag notext" title="No posting text saved">no text</span>';
    if(j.letter) flags += '<span class="flag on" title="Cover letter drafted">L</span>';
    if(j.questions.length){
      var cls = openQ(j) ? "open" : (newAnswer(j) ? "answered" : "");
      flags += '<span class="flag q '+cls+'" title="'+j.questions.length+' message(s)">Q'+j.questions.length+'</span>';
    }
    return '<tr data-id="'+j.id+'" class="'+(j.status==="closed"?"closed ":"")+(ui.sel===j.id?"sel":"")+'">'
      + '<td class="co">'+esc(j.company)+'</td>'
      + '<td class="role" title="'+esc(j.title)+'">'+esc(j.title)+'</td>'
      + '<td><span class="pill '+j.status+'">'+j.status+'</span></td>'
      + '<td class="num">'+fitCell(j.fit)+'</td>'
      + '<td class="band">'+esc(j.band||"—")+'</td>'
      + '<td class="loc">'+esc(j.location||"—")+'</td>'
      + '<td class="num" style="color:var(--muted)">'+esc(j.applied||j.posted||"—")+'</td>'
      + '<td><span class="flags">'+flags+'</span></td>'
      + '</tr>';
  }).join("");
  document.getElementById("rows").innerHTML = html;
  document.getElementById("empty").hidden = list.length > 0;
}

/* ============================ render: drawer ============================ */
var TABS = [
  {k:"brief", label:"Brief"},
  {k:"letter", label:"Letter"},
  {k:"questions", label:"Questions"},
  {k:"posting", label:"Posting"},
  {k:"apply", label:"Help me apply"}
];
function job(){ return state.jobs.filter(function(j){return j.id===ui.sel})[0]; }

function renderDrawer(keepTab){

function fixDashes(t){
  t = t.replace(/\s+—\s+/g, function(){ return ". "; });
  t = t.replace(/\. ([a-z])/g, function(m,c){ return ". " + c.toUpperCase(); });
  return t.replace(/—/g, ", ");
}

/* ============================ clipboard ============================ */
function copy(text, msg){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(msg); }
    catch(e){ toast("Copy failed — select the text manually", true); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
  } else fallback();
}
function copyOpenQuestions(){
  var out = [];

    if(!openQ(j)) return;
    var pending = [];
    for(var i=j.questions.length-1; i>=0; i--){

  var list = (todo.length ? todo : j.form).map(function(f, i){ return (i+1) + ". " + f.text; });

/* Lay the letter out at a given metric set. Returns the draw ops and the
   total height, so we can try a tighter set when a letter just overruns
   one page — a cover letter that breaks onto page two reads as careless. */
var PDF_METRICS = [
  {size:11,   lead:15.5, gap:11, margin:72, name:17,   rule:22},
  {size:10.5, lead:14.4, gap:9,  margin:66, name:16,   rule:19},
  {size:10,   lead:13.4, gap:8,  margin:60, name:15,   rule:17}
];
function layoutLetter(doc, text, m){
  var W = 612 - m.margin*2, y = m.margin, ops = [], first = true;
  var blocks = text.replace(/\r/g,"").split(/\n\s*\n/);

  blocks.forEach(function(block){
    var lines = block.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
    if(!lines.length) return;

    if(first){
      first = false;
      ops.push({t:"head", s:lines[0], x:m.margin, y:y, size:m.name});
      y += m.name + 4;
      if(lines[1]){
        ops.push({t:"contact", s:lines[1], x:m.margin, y:y});
        y += 12;
      }
      ops.push({t:"rule", x:m.margin, y:y, w:W});
      y += m.rule;
      return;
    }

    doc.setFont("times","normal").setFontSize(m.size);
    lines.forEach(function(line){
      var isShort = line.length < 62 && !/[.;]$/.test(line);
      if(isShort){
        ops.push({t:"line", s:line, x:m.margin, y:y, size:m.size, bold:/^Re:/i.test(line)});
        y += m.lead;
      } else {
        doc.splitTextToSize(line, W).forEach(function(w){
          ops.push({t:"line", s:w, x:m.margin, y:y, size:m.size});
          y += m.lead;
        });
      }
    });
    y += m.gap;
  });
  return {ops:ops, height:y, margin:m.margin, size:m.size};
}
function makePdf(j, text){
  if(!text || !text.trim()){ toast("Nothing to export", true); return; }
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast("PDF library did not load — copy the text instead", true); return;
  }
  var doc = new window.jspdf.jsPDF({unit:"pt", format:"letter"});
  var laid = null;
  for(var i=0;i<PDF_METRICS.length;i++){
    laid = layoutLetter(doc, text, PDF_METRICS[i]);
    if(laid.height <= 792 - PDF_METRICS[i].margin) break;   // fits one page
  }

  var pageBottom = 792 - laid.margin, offsetY = 0;
  laid.ops.forEach(function(op){
    var y = op.y - offsetY;
    if(y > pageBottom){
      doc.addPage();
      offsetY = op.y - laid.margin;
      y = laid.margin;
    }
    if(op.t === "head"){
      doc.setFont("times","bold").setFontSize(op.size).setTextColor(0);
      doc.text(op.s, op.x, y);
    } else if(op.t === "contact"){
      doc.setFont("times","normal").setFontSize(9.5).setTextColor(90);
      doc.text(op.s, op.x, y);
      doc.setTextColor(0);
    } else if(op.t === "rule"){
      doc.setDrawColor(190).setLineWidth(.7).line(op.x, y, op.x + op.w, y);
    } else {
      doc.setFont("times", op.bold ? "bold" : "normal").setFontSize(op.size).setTextColor(0);
      doc.text(op.s, op.x, y);
    }
  });

  // Name the file after the letter's own first line (the writer's name).
  var who = (text.split(/\r?\n/).filter(function(l){ return l.trim(); })[0] || "")
    .replace(/[^A-Za-z0-9]+/g,"");
  var slug = String(j.company).replace(/[^A-Za-z0-9]+/g,"");
  offer((who ? who + "_" : "") + "CoverLetter_" + slug + ".pdf", doc.output("blob"),
        "PDF saved (" + doc.getNumberOfPages() + " page" + (doc.getNumberOfPages()>1?"s":"") + ")");
}

/* ============================ paste parser ============================ */
var ROLE_WORDS = /(engineer|administrator|specialist|manager|lead|consultant|architect|analyst|developer|technician|director|support|operations|coordinator)/i;
var CO_SUFFIX = /(inc\.?|ltd\.?|llp|corp\.?|corporation|company|group|technologies|& son|limited|entertainment|systems)$/i;

function linkedinId(url){
  var m = String(url||"").match(/(?:jobs\/view\/(?:[^\/?#]*-)?|currentJobId=)(\d{6,})/);
  return m ? m[1] : "";
}
/* Indeed's job key: "vjk" in search results, "jk" on the job's own page. */
function indeedKey(url){
  url = String(url||"");
  if(!/indeed\./i.test(url)) return "";
  var m = url.match(/[?&#](?:vjk|jk)=([0-9a-f]{16})(?![0-9a-z])/i);
  return m ? m[1].toLowerCase() : "";
}
/* A search-results link opens the whole feed; store the job's own page. */
function indeedUrl(url){
  var key = indeedKey(url);
  if(!key) return url;
  var host = (String(url).match(/^https?:\/\/([^\/?#]+)/i) || [])[1] || "ca.indeed.com";
  return "https://" + host + "/viewjob?jk=" + key;
}
/* Which site and job a URL points at, for duplicate checks. */
function jobRef(url){
  var li = linkedinId(url);
  if(li) return {site:"LinkedIn", id:li};
  var ik = indeedKey(url);
  if(ik) return {site:"Indeed", id:ik};
  return null;
}

/* ---- Indeed ----
   A search-results paste holds a list of other jobs before the selected one,
   so everything is read from the selected job's own block. Its header (title,
   company, rating, location, pay, job type) sits just above "Apply now" or the
   "Job details" heading, sometimes under a "<Company> logo" line. */
var INDEED_PAGE = /^\s*Full job description\s*$/m;
var INDEED_ANCHOR = /^(apply now|apply on company site|profile insights|job details|full job description)$/i;
var INDEED_END = /^(report job|hiring lab|©\s*\d{4}\s*indeed)$/i;
var INDEED_BADGE = /^(easily apply|urgently hiring|responsive employer|hiring multiple candidates|new|just posted|today|often replies .*|typically responds .*|employer active .*|active \d+.*|posted .*|\d+(\.\d+)?|\d(\.\d)? out of 5 stars.*|[\d,]+ reviews?|.+ logo|[-–·|\s]+)$/i;
var INDEED_TYPE = /^(full-time|part-time|permanent|contract|fixed term contract|temporary|casual|internship|seasonal|freelance)\b/i;
var PLACE = /([A-Z][A-Za-z .'\-]+,\s*(?:BC|AB|ON|British Columbia|Alberta|Ontario|Canada))\b/;
function isPlace(l){
  return PLACE.test(l) || /^(remote|hybrid|on-?site|british columbia|alberta|ontario|canada)\b/i.test(l);
}
/* "$110,000–$140,000 a year" -> "$110,000 - $140,000"; other periods keep
   their unit and get a yearly estimate, like the biweekly band above. */
function indeedPay(l){
  var m = l.replace(/\s+/g," ").match(/\$\s?([\d,]+(?:\.\d+)?)(?:\s*[-–—]\s*\$?\s?([\d,]+(?:\.\d+)?))?\s*(?:an?|per)\s+(year|hour|day|week|month)\b/i);
  if(!m) return l;
  var lo = m[1], hi = m[2], unit = m[3].toLowerCase();
  var band = "$" + lo + (hi ? " - $" + hi : "");
  if(unit === "year") return band;
  var per = {hour:2080, day:260, week:52, month:12}[unit];
  var k = function(v){ return Math.round(parseFloat(v.replace(/,/g,""))*per/1000); };
  return band + (unit === "hour" ? " an hour" : " a " + unit)
    + " (~$" + k(lo) + "k" + (hi ? "-$" + k(hi) + "k" : "") + "/yr)";
}
function parseIndeed(raw, out){
  var all = raw.replace(/\r/g,"").split("\n").map(function(l){ return l.replace(/ /g," ").trim(); });
  var a = -1;
  for(var i=0;i<all.length;i++){ if(INDEED_ANCHOR.test(all[i])){ a = i; break; } }
  if(a < 0) return null;                          // not a layout we know
  var floor = 0;                                  // just below the last logo line
  for(var f=0;f<a;f++){ if(/ logo$/i.test(all[f])) floor = f + 1; }

  // Walk up from the anchor past pay, job type, location and badge lines:
  // the first two other lines are the company, then the title.
  var picked = [];
  for(var j=a-1; j>=floor && picked.length<2; j--){
    var l = all[j];
    if(!l || /\$\s?\d/.test(l) || INDEED_TYPE.test(l) || INDEED_BADGE.test(l) || isPlace(l)) continue;
    picked.push(j);
  }
  if(picked.length < 2) return null;
  var titleAt = picked[1];
  out.title = all[titleAt];
  out.company = all[picked[0]].replace(/\s+\d(\.\d)?(\s*out of 5 stars)?$/i, "");
  out.source = "Indeed";

  var head = all.slice(titleAt, a).filter(function(l){ return l && !INDEED_BADGE.test(l); });
  head.slice(2).forEach(function(l){
    if(!out.location && isPlace(l)){
      var pm = l.match(PLACE);
      out.location = pm ? pm[1].replace(/\s+/g," ") : l;
    }
    if(!out.band && /\$\s?\d/.test(l)) out.band = indeedPay(l);
  });

  var end = all.length;
  for(var e=a; e<all.length; e++){ if(INDEED_END.test(all[e])){ end = e; break; } }
  var body = all.slice(a, end).filter(function(l){ return !/^(apply now|apply on company site)$/i.test(l); });

  var posted = all.slice(titleAt, end).join("\n").match(/^posted (\d+)\+? days? ago$|^(just posted|today)$/im);
  if(posted){
    var d = new Date(Date.now() - (posted[1] ? parseInt(posted[1],10) : 0)*86400000);
    var p2 = function(x){return x<10?"0"+x:""+x};
    out.posted = d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
  }

  // Keep the job, not the page: no result list, site chrome or footer.
  out.posting = ((out.url ? out.url + "\n" : "") + head.join("\n") + "\n\n" + body.join("\n"))
    .replace(/\n{3,}/g, "\n\n")
    .replace(/\n+([A-Za-z0-9]{8,14})\s*$/, function(m, t){   // Indeed's trailing tracking code
      return /[a-z]/.test(t) && /[A-Z]/.test(t) && /\d/.test(t) ? "" : m;
    })
    .trim();
  return out;
}

function parsePaste(raw){
  var lines = raw.replace(/\r/g,"").split("\n")
    .map(function(l){ return l.replace(/ /g," ").trim(); })
    .filter(function(l){
      if(!l) return false;
      if(/^company logo/i.test(l)) return false;
      if(/^!\[/.test(l)) return false;
      if(/^·+$/.test(l)) return false;
      if(/^(save|saved|apply|easy apply|share|report this job|show more|see who)$/i.test(l)) return false;
      if(/^responses managed off linkedin/i.test(l)) return false;
      if(/^promoted by hirer/i.test(l)) return false;
      if(/^(show all|show match details|about the job|meet the hiring team)$/i.test(l)) return false;
      // a bare salary line ("82,000 - 94,000") is data, never a company name
      if(/^\$?\s?[\d][\d,.]*\s?[Kk]?\s*(?:-|–|—|to)\s*\$?\s?[\d][\d,.]*\s?[Kk]?\s*(?:CAD|USD)?(?:\s*\/\s*yr)?$/i.test(l)) return false;
      return true;
    });

  var out = {company:"", title:"", location:"", band:"", posted:"", url:"", source:""};

  // URL
  for(var i=0;i<lines.length;i++){
    var m = lines[i].match(/https?:\/\/[^\s)"']+/);
    if(m){ out.url = m[0]; break; }
  }
  if(/linkedin\./i.test(out.url)) out.source = "LinkedIn";
  else if(/indeed\./i.test(out.url)){ out.source = "Indeed"; out.url = indeedUrl(out.url); }
  if(out.source === "Indeed" || INDEED_PAGE.test(raw)){
    var indeed = parseIndeed(raw, out);
    if(indeed) return indeed;
  }

  // Band — LinkedIn's own "91K CAD/yr - 113K CAD/yr" chip comes first
  var joined = lines.join("\n");
  var cadm = joined.match(/([\d.]+)\s*K\s*CAD\s*\/\s*yr\s*(?:-|–|—|to)\s*([\d.]+)\s*K\s*CAD\s*\/\s*yr/i);
  if(cadm){
    var kfmt = function(v){ return "$" + Math.round(parseFloat(v)*1000).toLocaleString("en-US"); };
    out.band = kfmt(cadm[1]) + " - " + kfmt(cadm[2]);
  }
  if(!out.band){
    var biw = joined.match(/\$?\s?([\d,]+(?:\.\d+)?)\s*Biweekly/i);
    if(biw){
      var per = parseFloat(biw[1].replace(/,/g,""));
      out.band = "$" + per.toLocaleString("en-US") + " biweekly (~$"
        + Math.round(per*26/1000) + "k/yr)";
    }
  }
  if(!out.band){
    var bm = joined.match(/(?:CA\$|C\$|\$)\s?([\d][\d,\.]*)\s?([Kk])?\s*(?:-|–|—|to)\s*(?:CA\$|C\$|\$)?\s?([\d][\d,\.]*)\s?([Kk])?/);
    if(bm){
      var lo = bm[1] + (bm[2]||""), hi = bm[3] + (bm[4]||"");
      out.band = "$" + lo + " - $" + hi;
    } else {
      var bm2 = joined.match(/([\d,]{5,})\s*(?:-|–|—|to)\s*([\d,]{5,})/);
      if(bm2) out.band = "$" + bm2[1] + " - $" + bm2[2];
    }
  }

  // Location: a line with ", BC" / ", AB" / province-style
  for(var k=0;k<lines.length;k++){
    var L = lines[k];
    if(/^\$/.test(L)) continue;
    var lm = L.match(/([A-Z][A-Za-z .'\-]+,\s*(?:BC|AB|ON|British Columbia|Alberta|Ontario|Canada))\b/);
    if(lm){ out.location = lm[1].replace(/\s+/g," "); break; }
  }

  // Posted
  var pm = joined.match(/(\d+)\s+(hour|day|week|month)s?\s+ago/i);
  if(pm){
    var n = parseInt(pm[1],10), unit = pm[2].toLowerCase();
    var mult = unit==="hour"?0:unit==="day"?1:unit==="week"?7:30;
    var d = new Date(Date.now() - n*mult*86400000);
    var p = function(x){return x<10?"0"+x:""+x};
    out.posted = d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  } else {
    var pd = joined.match(/(20\d\d-\d\d-\d\d)/);
    if(pd) out.posted = pd[1];
  }

  // Title / company from the first few content lines
  var head = lines.filter(function(l){
    if(/^https?:/i.test(l)) return false;
    if(/^\$/.test(l)) return false;
    if(out.location && l.indexOf(out.location) === 0) return false;
    if(/\d+\s+(hour|day|week|month)s?\s+ago/i.test(l)) return false;
    if(/^\d+\s+applicant/i.test(l)) return false;
    if(/(full-time|part-time|contract|hybrid|on-?site|remote)$/i.test(l) && l.length < 26) return false;
    return true;
  }).slice(0,4);

  if(head.length){
    var a = head[0], b = head[1] || "";
    var aRole = ROLE_WORDS.test(a), bRole = ROLE_WORDS.test(b);
    var bCo = CO_SUFFIX.test(b.replace(/[.,]$/,""));
    if(aRole && !bRole){ out.title = a; out.company = b; }
    else if(bRole && !aRole){ out.company = a; out.title = b; }
    else if(aRole && bRole){ out.title = a; out.company = b; }
    else if(bCo){ out.title = a; out.company = b; }
    else { out.title = a; out.company = b; }
  }
  out.company = out.company.replace(/\s*[·|].*$/,"").trim();
  out.title = out.title.replace(/\s*[·|].*$/,"").trim();
  return out;
}

function showPreview(){
